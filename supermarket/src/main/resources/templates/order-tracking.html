<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Tracking</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">

    <!-- Bootstrap -->
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/css/style.css"/>

    <!-- Font Awesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        .step {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 120px;
        }
        .circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgray;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .completed {
            background-color: #28a745 !important;
        }
        .progress-line {
            flex-grow: 1;
            height: 6px;
            background-color: lightgray;
            margin: 0 10px;
            position: relative;
        }
        .completed-line {
            background-color: #28a745 !important;
        }
    </style>
</head>
<body>
<div id="loading"><div class="loader"></div></div>
<div th:replace="~{fragments/mutual :: header}"></div>
<div id="breadcrumb" class="section">
    <!-- container -->
    <div class="container">
        <!-- row -->
        <div class="row">
            <div class="col-md-12">
                <button class="navbar-toggle edited-bars" data-toggle="collapse" data-target="#togTar"><i class="fas fa-bars"></i></button>

                <!--				<h3 class="breadcrumb-header">Regular Page</h3>-->
                <ul class="breadcrumb-tree">
                    <li><a href="/">Home</a></li>
                    <li class="active">Tracking</li>
                </ul>
            </div>
        </div>
        <!-- /row -->
    </div>
    <!-- /container -->
</div>
<!-- SECTION -->
<div class="section">
    <!-- container -->
    <div class="container">
        <div style="margin-top: 1em;">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-10 col-xl-8">
                    <div class="card order-detail" style="border-radius: 10px;">
                        <div class="card-header px-4 py-5 text-center">
                            <h3 class="text-muted mb-0">Order Tracking</h3>
                        </div>
                        <div class="card order-detail" style="border-radius: 10px;">

                            <!-- Progress Steps -->
                            <div class="d-flex justify-content-between align-items-center p-4">
                                <div class="step">
                                    <div class="circle" th:classappend="${order.status == 'Verified' or order.status == 'Shipping' or order.status == 'Shipped' or order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'completed' : 'Pending'">
                                        <i class="fas fa-check"></i> <!-- Biểu tượng cho bước 1 -->
                                    </div>
                                    <p th:text="${order.status == 'Verified' or order.status == 'Shipping' or order.status == 'Shipped' or order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'Verified' : 'Pending'">Pending</p>
                                </div>

                                <div class="progress-line" th:classappend="${order.status == 'Shipping' or order.status == 'Shipped' or order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'completed-line' : ''"></div>
                                <div class="step">
                                    <div class="circle" th:classappend="${order.status == 'Shipped' or order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'completed' : ''">
                                        <i class="fas fa-truck"></i> <!-- Biểu tượng cho bước 2 -->
                                    </div>
                                    <p th:text="${order.status == 'Shipped' or order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'Shipped' : (${order.status == 'Shipping'} ? 'Shipping' : 'Pending')">Pending</p>
                                </div>

                                <div class="progress-line" th:classappend="${order.status == 'Delivering' or order.status == 'Delivered' or order.status == 'Completed'} ? 'completed-line' : ''"></div>
                                <div class="step">
                                    <div class="circle" th:classappend="${order.status == 'Delivered' or order.status == 'Completed'} ? 'completed' : ''">
                                        <i class="fas fa-box"></i> <!-- Biểu tượng cho bước 3 -->
                                    </div>
                                    <p th:text="${order.status == 'Delivered' or order.status == 'Completed'} ? 'Delivered' : (${order.status == 'Delivering'} ? 'Delivering' : 'Pending')">Pending</p>
                                </div>

                                <div class="progress-line" th:classappend="${order.status == 'Completed'} ? 'completed-line' : ''"></div>
                                <div class="step">
                                    <div class="circle" th:classappend="${order.status == 'Completed'} ? 'completed' : ''">
                                        <i class="fas fa-check-circle"></i> <!-- Biểu tượng cho bước 4 -->
                                    </div>
                                    <p>Completed</p>
                                </div>
                            </div>
                            <div th:if="${order.status == 'Delivered'}" class="text-center mb-4">
                                <form th:action="@{/order/update-status}" method="post">
                                    <input type="hidden" name="orderId" th:value="${order.id}" />
                                    <input type="hidden" name="status" value="Completed" />
                                    <button type="submit" class="btn btn-success">Received</button>
                                </form>
                            </div>

                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <p class="lead fw-normal mb-0 primary-color">Delivery address </p>
                                </div>
                                <div class="mb-3">
                                    <p class="text-muted mb-0"><strong>Name:</strong> <span th:text="${order.name}"></span></p>
                                    <p class="text-muted mb-0"><strong>Phone:</strong> <span th:text="${order.phone}"></span></p>
                                    <p class="text-muted mb-4"><strong>Delivery Address:</strong> <span th:text="${order.address}"></span></p>
                                </div>
                                <div class="card shadow-0 border mb-4" th:each="item : ${order.getItems()}">
                                    <div class="card-body">
                                        <div class="row d-flex align-items-center">
                                            <div class="col-xs-2">
                                                <img th:src="@{${item.product.getThumbnailFormat()}}"
                                                     class="img-fluid" alt="Phone">
                                            </div>
                                            <div class="col-xs-4 text-center d-flex justify-content-center align-items-center">
                                                <p class="text-muted mb-0" th:text="${item.product.getName()}"></p>
                                            </div>
                                            <div class="col-xs-2 text-center d-flex justify-content-center align-items-center">
                                                <p class="text-muted mb-0 small" th:text="${item.product.getColor()}"></p>
                                            </div>
                                            <div class="col-xs-2 text-center d-flex justify-content-center align-items-center">
                                                <p class="text-muted mb-0 small">Qty: <span th:text="${item.quantity}"></span></p>
                                            </div>
                                            <div class="col-xs-2 text-center d-flex justify-content-center align-items-center">
                                                $<p class="text-muted mb-0 small" th:text="${item.getPriceString()}"></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="d-flex justify-content-between pt-2">
                                    <p class="fw-bold mb-0">Order Details</p>
                                    <p class="text-muted mb-0"><span class="fw-bold me-4">Total </span> <span th:text="${order.getToltalPriceString()}"></span></p>
                                </div>

                                <div class="d-flex justify-content-between pt-2 hide">
                                    <p class="text-muted mb-0">Invoice Number : 788152</p>
                                    <p class="text-muted mb-0"><span class="fw-bold me-4">Discount</span> $0.00</p>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <p class="text-muted mb-0">Invoice Date : <span th:text="${order.getOrderDate()}"></span></p>
                                    <p class="text-muted mb-0 hide"><span class="fw-bold me-4">GST 18%</span> 123</p>
                                </div>

                                <div class="d-flex justify-content-between mb-5">
                                    <p class="text-muted mb-0" style="visibility: hidden;">Recepits Voucher : None</p>
                                    <p class="text-muted mb-0"><span class="fw-bold me-4">Delivery Charges</span> Free</p>
                                </div>
                            </div>
                            <div class="card-footer border-0 px-4 py-5 primary-gradient"
                                 style="border-bottom-left-radius: 10px; border-bottom-right-radius: 10px;">
                                <h5 class="d-flex align-items-center justify-content-end text-white text-uppercase mb-0 text-white" style="gap: 1em; font-weight: 700;">Total
                                    paid: <strong class="h2 mb-0 ms-2" th:text="${order.getToltalPriceString()}"></strong></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- /container -->
</div>
<!-- /SECTION -->

<div th:replace="~{fragments/mutual :: footer}"></div>

<!-- jQuery Plugins -->
<script src="/js/jquery.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/main.js"></script>

</body>
</html>
