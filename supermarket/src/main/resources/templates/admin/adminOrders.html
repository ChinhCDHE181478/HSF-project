<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Orders</title>

  <!-- Bootstrap & Fonts -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/form.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>

<!-- Header -->


<!-- SECTION -->
<div class="section">
    <div th:replace="fragments/mutual :: adminHeader"></div>

    <!-- Search Filter -->
    <div class="container mt-3 mb-4">
        <form th:action="@{/admin/orders}" method="get" class="form-inline">
            <label class="mr-2" for="statusFilter">Filter by Status:</label>
            <select class="form-control mr-2" id="statusFilter" name="status">
                <option value="">All</option>
                <option value="Pending">Pending</option>
                <option value="Verified">Verified</option>
                <option value="Shipping">Shipping</option>
                <option value="Delivering">Delivering</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Completed">Completed</option>
            </select>
            <button class="btn btn-outline-success my-2 my-sm-0 col-3" type="submit">Search</button>
        </form>
    </div>


    <!-- Alert Messages -->
    <div class="container">
  <div class="row">
    <div th:if="${success}" th:text="${success}" class="col-12 alert alert-primary" role="alert"></div>
    <div th:if="${error}" th:text="${error}" class="col-12 alert alert-danger" role="alert"></div>
  </div>

  <!-- Order Table -->
  <div class="row d-flex justify-content-center align-items-center h-100">
    <div class="col-12">
      <div class="card" style="border-radius: 10px;">
        <table class="table table-hover">
          <thead>
          <tr>
            <th scope="col">Order ID</th>
            <th scope="col">Customer Name</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="order : ${orderPage.content}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.name}"></td>
            <td>
              <span th:text="${order.status}" class="order-status"></span>
            </td>
            <td>
              <form th:action="@{/admin/updateOrderStatus}" method="post" class="form-inline">
                <input type="hidden" name="orderId" th:value="${order.id}">
                  <select name="status" class="form-control form-control-sm mr-2">
                      <option value="Pending" th:selected="${order.status == 'Pending'}">Pending</option>
                      <option value="Verified" th:selected="${order.status == 'Verified'}">Verified</option>
                      <option value="Shipping" th:selected="${order.status == 'Shipping'}">Shipping</option>
                      <option value="Delivering" th:selected="${order.status == 'Delivering'}">Delivering</option>
                      <option value="Shipped" th:selected="${order.status == 'Shipped'}">Shipped</option>
                      <option value="Delivered" th:selected="${order.status == 'Delivered'}">Delivered</option>
                      <option value="Completed" th:selected="${order.status == 'Completed'}">Completed</option>
                  </select>

                  <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  </div>

  <!-- Pagination -->
  <div th:unless="${name}" class="container store-filter clearfix">
    <span class="store-qty">
      Showing <b class="text-muted" th:text="${(orderPage.number * orderPage.size) + 1} + '-' + ${(orderPage.number * orderPage.size) + orderPage.getNumberOfElements()}"></b>
      of <b id="total-item" class="text-muted" th:text="${orderPage.totalElements}"></b> orders
    </span>
    <ul class="store-pagination" th:data-page="${orderPage.number + 1}">
      <li th:if="${orderPage.hasPrevious()}">
        <a class="page-link" th:href="@{'?page=1'}" th:data-page="1"><i class="fa fa-angle-double-left"></i></a>
      </li>
      <li th:if="${orderPage.hasPrevious()}">
        <a class="page-link" th:href="@{'?page=' + (orderPage.number)}" th:data-page="${orderPage.number}"><i class="fa fa-angle-left"></i></a>
      </li>
      <th:block th:each="page : ${#numbers.sequence(1, orderPage.totalPages)}">
        <li th:if="${page >= orderPage.number and page <= orderPage.number + 1}" th:class="${page == orderPage.number + 1} ? 'active' : ''">
          <a th:text="${page}" class="page-link" th:href="@{'?page=' + ${page}}"></a>
        </li>
      </th:block>
      <li th:if="${orderPage.hasNext()}">
        <a class="page-link" th:href="@{'?page=' + (orderPage.number + 2)}"><i class="fa fa-angle-right"></i></a>
      </li>
      <li th:if="${orderPage.hasNext()}">
        <a class="page-link" th:href="@{'?page=' + orderPage.totalPages}" th:data-page="${orderPage.totalPages}"><i class="fa fa-angle-double-right"></i></a>
      </li>
    </ul>
  </div>
</div>

<!-- Bootstrap Scripts -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
        integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
        crossorigin="anonymous"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".order-status").forEach(function (statusElement) {
      let status = statusElement.textContent.trim();
      let badgeClass = "badge badge-secondary";

      switch (status) {
        case "Pending":
          badgeClass = "badge badge-warning";
          break;
        case "Verified":
          badgeClass = "badge badge-info";
          break;
        case "Shipping":
          badgeClass = "badge badge-primary";
          break;
        case "Delivering":
          badgeClass = "badge badge-light";
          break;
        case "Shipped":
          badgeClass = "badge badge-dark";
          break;
        case "Delivered":
          badgeClass = "badge badge-success";
          break;
        case "Completed":
          badgeClass = "badge badge-secondary";
          break;
      }

      statusElement.classList.add(...badgeClass.split(" "));
    });
  });
</script>

</body>
</html>
